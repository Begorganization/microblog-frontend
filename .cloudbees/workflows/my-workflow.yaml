apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: This is a system-generated parameter and is required for use in
          application releases. Refer to
          https://docs.cloudbees.com/docs/cloudbees-platform/latest/applications/releases#manifest
          for the expected format
metadata:
  stages/v1alpha1:
    - name: development
      jobs:
        - deploy-to-development
        - myautoapproval
    - name: production
      jobs:
        - deploy-to-production
    - name: staging
      jobs:
        - deploy-to-staging
jobs:
  deploy-to-development:
    steps:
      - name: Deploy to development
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "Deploying to development"
  deploy-to-production:
    needs: myautoapproval
    steps:
      - name: Deploy to production
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "Deploying to production"
  deploy-to-staging:
    needs: deploy-to-production
    steps:
      - name: Deploy to staging
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "Deploying to staging"
  myautoapproval:
    needs:
      - deploy-to-development
    timeout-minutes: 4320
    with:
      instructions: ""
      disallowLaunchByUser: false
      approvers: 327a58da-5299-11ec-bf9c-42010a83ae75
      notifyAllEligibleUsers: false
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
